type: postgresql
mode: standalone

cluster:
  instances: 2
  storage:
    size: 256Mi

backups:
  enabled: true
  provider: s3
  endpointURL: "https://object-store-svc.object-store.svc.cluster.local:9000"
  endpointCA:
    name: kube-root-ca.crt
    key: ca.crt
  wal:
    encryption: ""
  data:
    encryption: ""
  s3:
    bucket: "mybucket"
    path: "/replica/v1"
    accessKey: "objectstore"
    secretKey: "objectstore123"
    region: "us-east-1"
  scheduledBackups: []
  retentionPolicy: "30d"
