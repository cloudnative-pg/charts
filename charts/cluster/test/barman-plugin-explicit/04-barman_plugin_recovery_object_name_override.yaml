type: postgresql
mode: recovery
cluster:
  instances: 1
  storage:
    size: 256Mi

recovery:
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: recovery-asd
  clusterName: "source-cluster"
  provider: s3
  endpointURL: "https://object-store-svc.object-store.svc.cluster.local:9000"
  endpointCA:
    name: kube-root-ca.crt
    key: ca.crt
  wal:
    encryption: ""
  data:
    encryption: ""
  s3:
    bucket: "mybucket"
    path: "/barman-plugin-recovery-override/v1"
    accessKey: "objectstore"
    secretKey: "objectstore123"
    region: "us-east-1"

backups:
  enabled: false
