type: postgresql
mode: standalone
cluster:
  instances: 1
  storage:
    size: 256Mi
  plugins:
  - name: foo.example.com
    enabled: true
    isWALArchiver: false
    parameters:
      foo: bar
  - name: barman-cloud.cloudnative-pg.io
    enabled: true
    isWALArchiver: true

backups:
  enabled: true
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  provider: s3
  endpointURL: "https://object-store-svc.object-store.svc.cluster.local:9000"
  endpointCA:
    name: kube-root-ca.crt
    key: ca.crt
  wal:
    encryption: ""
  data:
    encryption: ""
  s3:
    bucket: "mybucket"
    path: "/barman-plugin-scheduledbackups/v1"
    accessKey: "objectstore"
    secretKey: "objectstore123"
    region: "us-east-1"
  retentionPolicy: "30d"
