type: postgresql
mode: recovery

cluster:
  instances: 2
  storage:
    size: 256Mi

recovery:
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  clusterName: "barman-plugin-backup-restore-cluster"
  provider: s3
  endpointURL: "https://object-store-svc.object-store.svc.cluster.local:9000"
  endpointCA:
    name: kube-root-ca.crt
    key: ca.crt
  wal:
    encryption: ""
  data:
    encryption: ""
  s3:
    bucket: "mybucket"
    path: "/barman-plugin-backup-restore/v1"
    accessKey: "objectstore"
    secretKey: "objectstore123"
    region: "us-east-1"
  scheduledBackups: []
  retentionPolicy: "30d"

backups:
  enabled: true
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  provider: s3
  endpointURL: "https://object-store-svc.object-store.svc.cluster.local:9000"
  endpointCA:
    name: kube-root-ca.crt
    key: ca.crt
  wal:
    encryption: ""
  data:
    encryption: ""
  s3:
    bucket: "mybucket"
    path: "/barman-plugin-backup-restore/v2"
    accessKey: "objectstore"
    secretKey: "objectstore123"
    region: "us-east-1"
  scheduledBackups: []
  retentionPolicy: "30d"
