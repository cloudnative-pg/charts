apiVersion: batch/v1
kind: Job
metadata:
  name: objectstore-cleanup
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: objectstore-cleanup
        image: ($values.awsCliImage)
        env:
        - name: AWS_ENDPOINT_URL
          value: https://object-store-svc.object-store:9000
        - name: AWS_ACCESS_KEY_ID
          value: objectstore
        - name: AWS_SECRET_ACCESS_KEY
          value: objectstore123
        - name: AWS_DEFAULT_REGION
          value: us-east-1
        - name: AWS_REQUEST_CHECKSUM_CALCULATION
          value: when_required
        - name: AWS_RESPONSE_CHECKSUM_VALIDATION
          value: when_required
        command: ['sh', '-c']
        args:
         - aws --no-verify-ssl s3 rm --recursive "s3://mybucket/barman-plugin-scheduledbackups"
