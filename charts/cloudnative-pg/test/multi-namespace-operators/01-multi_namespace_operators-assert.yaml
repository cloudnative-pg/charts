            - cnpg-multi-2
  - name: vscheduledbackup.cnpg.io
  - name: vdatabase.cnpg.io
  - name: vpooler.cnpg.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cnpg-cloudnative-pg-cnpg-multi-1
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cnpg-cloudnative-pg-cnpg-multi-1
subjects:
  - kind: ServiceAccount
    name: cnpg-cloudnative-pg
    namespace: cnpg-multi-1
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cnpg-cloudnative-pg-cnpg-multi-2
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cnpg-cloudnative-pg-cnpg-multi-2
subjects:
  - kind: ServiceAccount
    name: cnpg-cloudnative-pg
