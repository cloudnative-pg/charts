name: Setup Kind
description: Sets up a kind cluster and installs Helm and kubectl
outputs:
  helm-path:
    description: The path to the Helm binary
    value: ${{ steps.helm.outputs.helm-path }}
  kubectl-path:
    description: The path to the kubectl binary
    value: ${{ steps.kubectl.outputs.kubectl-path }}
runs:
  using: composite
  steps:
    - id: helm
      name: Set up Helm
      uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      with:
        version: v4.3.2

    - id: kubectl
      name: Install kubectl
      uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0

    - name: Create kind cluster
      uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
