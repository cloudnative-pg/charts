name: test( operator )

on:
  pull_request:
    branches-ignore:
      - 'gh-pages'
  push:
    branches-ignore:
      - 'main'
      - 'gh-pages'

permissions: read-all

jobs:
  test-list:
    runs-on: ubuntu-26.04
    if: github.event_name != 'push' || github.repository_owner != 'cloudnative-pg'
    outputs:
      tests: ${{ steps.listTests.outputs.tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - id: listTests
        run: |
          echo "tests=$(ls charts/cloudnative-pg/test -1 | jq -cRn '{ include: [inputs | { test: "\(.)" }]}')" >> $GITHUB_OUTPUT

  test:
    needs: test-list
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.test-list.outputs.tests) }}
    name: ${{ matrix.test }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup kind
        uses: ./.github/actions/setup-kind

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Build the operator chart dependencies
        run: helm dependency update ./charts/cloudnative-pg

      - name: Install Chainsaw
        uses: kyverno/action-install-chainsaw@1223ef75bedeb59c4e7b5455463d4316e76dff01 # v0.2.15
        with:
          verify: true

      - name: Run Kyverno/Chainsaw
        env:
          MATRIX_TEST: ${{ matrix.test }}
        run: chainsaw test "charts/cloudnative-pg/test/${MATRIX_TEST}"
