##
# Create a PR for a release when a commit is pushed on a release/*-v* branch to support the releases of both the
# operator and cluster charts
name: release-pr

on:
  push:
    branches:
      - release/*-v*

permissions: read-all

jobs:
  create-pull-request:
    runs-on: ubuntu-26.04
    permissions:
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Get tag
        run: |
          TAG="${GITHUB_REF##*/}"
          echo "TAG=${TAG}" >> $GITHUB_ENV
      - name: Pull Request
        id: open-pr
        uses: repo-sync/pull-request@572331753c3787dee4a6c0b6719c889af9646b81 # v2.12
        with:
          destination_branch: main
          github_token: ${{ secrets.REPO_GHA_PAT }}
          pr_title: "Release ${{ env.TAG }}"
          pr_body: "Automated PR. Will trigger the ${{ env.TAG }} release when approved."
          pr_label: "release"
          pr_assignee: ${{ github.actor }}
