name: release-publish

on:
  push:
    branches:
      - main

# Two quick merges/pushes to main can cause a chart publish race condition
concurrency:
  group: chart-release
  cancel-in-progress: false

permissions: read-all

jobs:
  release:
    runs-on: ubuntu-26.04
    permissions:
      contents: write # Required for pushing the Helm charts to the gh-pages branch
      packages: write # Required for GHCR access
      id-token: write # Required for signing
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # important for fetching all history to run comparison against

      - name: Fetch history
        run: git fetch --prune

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Import PGP Private Key
        run: |
          echo "${{ secrets.PGP_PRIVATE_KEY }}" | gpg --dearmor --output /tmp/keyring.gpg
          echo "${{ secrets.PGP_KEY_PASSPHRASE }}" > /tmp/passphrase-file.txt

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.1

      - name: Add chart dependencies
        run: |
          helm repo add cnpg-grafana-dashboard https://cloudnative-pg.github.io/grafana-dashboards

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@92c6b97fa9f664492a2592e0d1d80bc6bf378957 # v1.9.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          CR_KEY: helm-charts+no-reply@cloudnative-pg.io
          CR_KEYRING: /tmp/keyring.gpg
          CR_PASSPHRASE_FILE: /tmp/passphrase-file.txt
          CR_SIGN: true
          CR_SKIP_EXISTING: true
          CR_GENERATE_RELEASE_NOTES: true
          CR_RELEASE_NAME_TEMPLATE: "{{ .Name }}-v{{ .Version }}"

      - name: Securely delete the PGP key and passphrase
        if: always()
        run: shred --remove=wipesync /tmp/keyring.gpg /tmp/passphrase-file.txt

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install sigstore/cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Push charts to GHCR
        env:
          COSIGN_EXPERIMENTAL: 1
        # when filling gaps with previously released charts, cr would create
        # nothing in .cr-release-packages/, and the original globbing character
        # would be preserved, causing a non-zero exit. Set nullglob to fix this
        run: |
          shopt -s nullglob
          for pkg in .cr-release-packages/*.tgz; do
            name=$(helm show chart "${pkg}" | yq -r '.name')
            version=$(helm show chart "${pkg}" | yq -r '.version')
            repo="ghcr.io/${GITHUB_REPOSITORY}/${name}"

            # cr packages any chart with files changed since the last tag, not
            # just ones whose version was bumped, and CR_SKIP_EXISTING only gates
            # the GitHub release. Skip versions already in GHCR, otherwise an
            # unrelated edit republishes a chart under an unchanged tag with a
            # new digest.
            if output=$(helm show chart oci://"${repo}" --version "${version}" 2>&1); then
              echo "::notice::Skipping ${name} ${version}: already published to GHCR"
              continue
            elif grep -q "not found" <<< "${output}"; then
              : # genuinely absent — fall through to push and sign
            else
              echo "::error::Cannot verify ${name} ${version} in GHCR; refusing to push blind"
              echo "${output}"
              exit 1
            fi

            helm push "${pkg}" oci://ghcr.io/"${GITHUB_REPOSITORY}"
            cosign sign --yes "${repo}:${version}"
          done
